name: DOI sentinel reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "methods/collect_literature.py"
      - "methods/build_provisional_rankings.py"
      - "tests/test_verified_doi_reconciliation.py"
      - ".github/workflows/doi-reconciliation.yml"
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test identity, scope and scientific invariants
        run: python -m unittest discover -s tests -v
      - name: Download a substantial historical harvest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p baseline
          RUNS="$(gh run list --repo "$REPO" --status completed --limit 80 --json databaseId,name,createdAt --jq '[.[] | select(.name == "Literature census (candidate harvest)" or .name == "Electrochemical expansion harvest" or .name == "DOI sentinel reconciliation")] | sort_by(.createdAt) | reverse | .[].databaseId')"
          SELECTED=""
          for RUN_ID in $RUNS; do
            rm -rf baseline; mkdir -p baseline
            if ! gh run download "$RUN_ID" --repo "$REPO" --name "literature-candidates-and-audit" --dir baseline >/dev/null 2>&1; then continue; fi
            if python - <<'PY'
          import json,pathlib
          f=pathlib.Path("baseline/candidates.json")
          if not f.exists():raise SystemExit(1)
          data=json.loads(f.read_text())["records"]
          if len(data)<10000 or sum(bool(r.get("openalex_id")) for r in data)<5000:raise SystemExit(1)
          print("Substantial baseline:",len(data))
          PY
            then SELECTED="$RUN_ID"; break; fi
          done
          if [ -z "$SELECTED" ]; then echo "::error::No usable bibliographic baseline"; exit 1; fi
          echo "BASELINE_RUN=$SELECTED" >> "$GITHUB_ENV"
      - name: Retrieve exact DOI records, reconcile bylines, and preserve provenance
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python methods/collect_literature.py \
            --baseline baseline/candidates.json \
            --baseline-audit baseline/query_audit.json \
            --doi-only --output output
      - name: Generate fresh paper-backed ranking and bibliographic audit
        run: |
          python methods/build_provisional_rankings.py \
            --input output/candidates.json \
            --output output/provisional_rankings.json \
            --csv output/provisional_rankings.csv
          python methods/electrochemical_seed_audit.py \
            --input output/candidates.json \
            --output output/electrochemical_coverage_audit.json
          python - <<'PY'
          import json
          d=json.load(open("output/provisional_rankings.json"))
          s=json.load(open("output/candidates.json"))
          target="0000-0001-5079-3123"
          records=[r for r in s["records"] if any(a.get("verified_orcid_from_publication")==target for a in r.get("authors",[]))]
          relevant=[r for r in d["rankings"].get("Electrochemical",[]) if r.get("orcid")==target and r.get("publication_count",0)>=2]
          print("Publisher-corroborated Forster DOI records:",[(r.get("doi"),r.get("title")) for r in records])
          print("Forster electrochemical provisional rows:",[(r["name"],r["publication_count"],r.get("rank"),r.get("score")) for r in relevant])
          if len(relevant)!=1:
              raise SystemExit("Forster reconciliation unresolved or insufficient papers: do not publish manufactured rankings")
          eligible_dois={p.get("doi") for p in relevant[0].get("papers",[])}
          needed={"10.1016/j.apmt.2020.100804","10.1016/j.apmt.2022.101481","10.1016/j.elecom.2023.107626","10.1021/acs.langmuir.6c00755"}
          if len(needed & eligible_dois)<3:
              raise SystemExit("Fewer than three independent original Forster primary-study DOIs verified")
          if "10.1016/j.elecom.2024.107832" in eligible_dois:
              raise SystemExit("Review erroneously scored as an original study")
          if relevant[0].get("institution")!="Dublin City University":
              raise SystemExit("Institution metadata does not match documented paper affiliations")
          print("Source-backed Forster inclusion with original-paper threshold confirmed")
          PY
      - name: Upload complete traceable corpus and refreshed scores
        uses: actions/upload-artifact@v4
        with:
          name: literature-candidates-and-audit
          path: output/
          retention-days: 90
          if-no-files-found: error
