name: Electro-mediated pharmaceutics harvest
on:
  workflow_dispatch:
    inputs:
      pages_per_query:
        description: "Maximum pages for electro-mediated pharmaceutical evidence search; not exhaustive"
        type: choice
        options: ["3", "6", "10"]
        default: "3"
        required: true
  push:
    branches: [main]
    paths:
      - "methods/collect_literature.py"
      - "methods/build_provisional_rankings.py"
      - "methods/electrical_treatment_coverage_audit.py"
      - "methods/electropharmaceutics_focus.py"
      - "methods/audit_researcher_publications.py"
      - "evidence/rawson_publisher_reference_dois.json"
      - "tests/test_electropharmaceutics_scope.py"
      - ".github/workflows/electrical-therapies-expansion.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: electropharmaceutics-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scientific classification, identity and scope regression tests
        run: |
          python -m py_compile methods/*.py
          python -m unittest discover -s tests -v
      - name: Select substantial baseline with bibliographic identifiers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p baseline
          RUNS="$(gh run list --repo "$REPO" --status completed --limit 100 --json databaseId,name,createdAt --jq '[.[] | select(.name == "Literature census (candidate harvest)" or .name == "Electrochemical expansion harvest" or .name == "DOI sentinel reconciliation" or .name == "Electrical therapies expansion harvest")] | sort_by(.createdAt) | reverse | .[].databaseId')"
          SELECTED=""
          for RUN_ID in $RUNS; do
            rm -rf baseline; mkdir -p baseline
            if ! gh run download "$RUN_ID" --repo "$REPO" --name "literature-candidates-and-audit" --dir baseline >/dev/null 2>&1; then continue; fi
            if python - <<'PY'
          import json,pathlib
          f=pathlib.Path("baseline/candidates.json")
          if not f.exists():raise SystemExit(1)
          items=json.loads(f.read_text(encoding="utf-8")).get("records") or []
          if len(items)<10000 or sum(bool(x.get("openalex_id")) for x in items)<5000:raise SystemExit(1)
          print("Validated bibliographic baseline",len(items))
          PY
            then SELECTED="$RUN_ID"; break; fi
          done
          if [ -z "$SELECTED" ]; then echo "::error::No substantial candidate baseline available"; exit 1; fi
          echo "BASELINE_RUN=$SELECTED" >> "$GITHUB_ENV"
      - name: Search electrically mediated pharmaceutical action and retrieve DOI source works
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PAGES_INPUT: ${{ inputs.pages_per_query }}
        run: |
          python methods/collect_literature.py \
            --baseline baseline/candidates.json \
            --baseline-audit baseline/query_audit.json \
            --only-modalities electropharmaceutics,electrochemical,electrochemotherapy \
            --pages "${PAGES_INPUT:-3}" \
            --output output
      - name: Recalculate only electro-mediated pharmaceutical candidate studies
        run: |
          python methods/electropharmaceutics_focus.py \
            --input output/candidates.json \
            --output output/electropharmaceutics_rankings.json \
            --csv output/electropharmaceutics_rankings.csv \
            --register output/electropharmaceutics_screening_register.json
          python methods/audit_researcher_publications.py \
            --input output/candidates.json \
            --reference evidence/rawson_publisher_reference_dois.json \
            --output output/rawson_publication_audit.json
          python - <<'PY'
          import json
          ranking=json.load(open("output/electropharmaceutics_rankings.json"))
          report=json.load(open("output/rawson_publication_audit.json"))
          assert ranking["scientific_validation"]=="NOT_INDEPENDENTLY_SCREENED"
          assert ranking["scope"]=="Electro-Mediated Pharmaceutics"
          assert ranking["summary"]["machine_screened_papers"]>0
          assert "TTFields" not in ranking["rankings"]
          assert report["status"]=="BIBLIOGRAPHY_SAMPLE_NOT_EXHAUSTIVE"
          assert report["found_in_candidate_corpus"]>=2, "DOI retrieval incomplete; do not replace current website"
          print("Direct candidates:",ranking["summary"]["machine_screened_papers"])
          print("Rawson reference DOIs matched:",report["found_in_candidate_corpus"],"/",report["total_reference_works"])
          print("Publication eligibility and world rankings NOT independently verified")
          PY
      - name: Upload focused candidate corpus, DOI audit and machine-ranked context
        uses: actions/upload-artifact@v4
        with:
          name: literature-candidates-and-audit
          path: output/
          retention-days: 90
          if-no-files-found: error
