name: Publish atlas website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "atlas_site.zip"
      - ".github/workflows/publish-website.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare full Atlas when optional ZIP is uploaded
        run: |
          mkdir -p _site
          if [ -f atlas_site.zip ]; then
            unzip -oq atlas_site.zip -d _site
          else
            cp index.html _site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
