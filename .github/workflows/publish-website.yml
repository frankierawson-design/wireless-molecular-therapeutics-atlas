name: Publish atlas website
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Literature census (candidate harvest)
      - Electrochemical expansion harvest
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "index.html"
      - "atlas_site.zip"
      - "methods/build_provisional_rankings.py"
      - "methods/electrochemical_seed_audit.py"
      - "methods/audit_ranking_quality.py"
      - "methods/build_electrochemical_queue.py"
      - "methods/collect_literature.py"
      - "tests/**"
      - ".github/workflows/publish-website.yml"
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare Atlas website
        run: |
          mkdir -p _site/data
          if [ -f atlas_site.zip ]; then
            unzip -oq atlas_site.zip -d _site
          else
            cp index.html _site/index.html
          fi
      - name: Retrieve latest completed candidate harvest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          COMPLETED_HARVEST_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          mkdir -p _harvest
          # Newer runs can be marked "successful" despite rate limits or
          # severe truncation. Validate their corpus before deployment.
          RUNS="$(gh run list --repo "$GITHUB_REPO" --status completed --limit 65 --json databaseId,name,createdAt --jq '[.[] | select(.name == "Literature census (candidate harvest)" or .name == "Electrochemical expansion harvest")] | sort_by(.createdAt) | reverse | .[].databaseId')"
          CHOSEN=""
          for TRY_ID in $COMPLETED_HARVEST_ID $RUNS; do
            rm -rf _harvest
            mkdir -p _harvest
            if ! gh run download "$TRY_ID" --repo "$GITHUB_REPO" --name "literature-candidates-and-audit" --dir _harvest >/dev/null 2>&1; then
              continue
            fi
            if python - <<'PY'
          import json,pathlib
          file=pathlib.Path("_harvest/candidates.json")
          if not file.is_file():raise SystemExit(1)
          data=json.loads(file.read_text(encoding="utf8"))
          works=data.get("records") or []
          total=len(works)
          with_ids=sum(bool(w.get("openalex_id")) for w in works)
          print("Candidate harvest validation: all",total,"OpenAlex linked",with_ids)
          if total < 10000 or with_ids < 5000:raise SystemExit(1)
          PY
            then
              CHOSEN="$TRY_ID"
              break
            fi
          done
          if [ -z "$CHOSEN" ]; then
            echo "::error::No literature artifact passes coverage gates. Previous website left intact."
            exit 1
          fi
          echo "Using validated candidate harvest run: $CHOSEN"
          cp _harvest/summary.json _site/data/search_summary.json
          cp _harvest/query_audit.json _site/data/query_audit.json
          printf '{"source_run_id":"%s","retrieval_conclusion":"provisional audited candidate artifact"}\n' "$CHOSEN" > _site/data/source_provenance.json
      - name: Validate identity, merge and institution regression tests
        run: python -m unittest discover -s tests -v
      - name: Calculate provisional, paper-backed rankings
        run: |
          python methods/build_provisional_rankings.py \
            --input _harvest/candidates.json \
            --output _site/data/provisional_rankings.json \
            --csv _site/data/provisional_rankings.csv
          python - <<'PY'
          import json
          d=json.load(open("_site/data/provisional_rankings.json"))
          assert d["summary"]["machine_screened_papers"] > 100
          assert len(d["rankings"]["Overall"]) > 10
          assert "Provisional" in d["ranking_label"]
          print("Ranked overall:",len(d["rankings"]["Overall"]))
          print("Screened papers:",d["summary"]["machine_screened_papers"])
          print("Top 5:",[(r["name"],r["score"]) for r in d["rankings"]["Overall"][:5]])
          PY
      - name: Independently audit scored metadata before deployment
        run: |
          python methods/audit_ranking_quality.py \
            --candidates _harvest/candidates.json \
            --ranking _site/data/provisional_rankings.json \
            --search-summary _harvest/summary.json \
            --output _site/data/quality_audit.json
          python - <<'PY'
          import json
          audit=json.load(open("_site/data/quality_audit.json"))
          assert audit["status"] == "NOT_VALIDATED_WORLD_RANKING"
          assert not audit["scored_work_metadata"]["explicit_nonoriginal"]
          assert audit["duplicate_score_evidence_groups"] == 0
          assert audit["scored_work_metadata"]["identifier_missing"] == 0
          print("Scored research integrity checks passed; screening is still provisional")
          PY
      - name: Generate electrochemical DOI coverage audit for the website
        run: |
          python methods/electrochemical_seed_audit.py \
            --input _harvest/candidates.json \
            --output _site/data/electrochemical_coverage_audit.json
      - name: Publish electrochemical screening queue independently of citation eligibility
        run: |
          python methods/build_electrochemical_queue.py \
            --input _harvest/candidates.json \
            --output _site/data/electrochemical_screening_queue.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
