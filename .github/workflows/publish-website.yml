name: Publish atlas website
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Literature census (candidate harvest)
      - Electrochemical expansion harvest
      - DOI sentinel reconciliation
      - Electrical therapies expansion harvest
      - Electro-mediated pharmaceutics harvest
    types:
      - completed
  push:
    branches: [main]
    paths:
      - "index.html"
      - "atlas_site.zip"
      - "methods/build_provisional_rankings.py"
      - "methods/electrochemical_seed_audit.py"
      - "methods/audit_ranking_quality.py"
      - "methods/build_electrochemical_queue.py"
      - "methods/collect_literature.py"
      - "methods/electropharmaceutics_focus.py"
      - "methods/audit_researcher_publications.py"
      - "evidence/rawson_publisher_reference_dois.json"
      - "methods/electrical_treatment_coverage_audit.py"
      - "methods/build_electrical_treatment_queue.py"
      - ".github/workflows/electrical-therapies-expansion.yml"
      - ".github/workflows/doi-reconciliation.yml"
      - "tests/**"
      - ".github/workflows/publish-website.yml"
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare Atlas website
        run: |
          mkdir -p _site/data
          if [ -f atlas_site.zip ]; then
            unzip -oq atlas_site.zip -d _site
          else
            cp index.html _site/index.html
          fi
          cp index.html _site/index.html
      - name: Retrieve latest completed candidate harvest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          COMPLETED_HARVEST_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          mkdir -p _harvest
          # Newer runs can be marked "successful" despite rate limits or
          # severe truncation. Validate their corpus before deployment.
          # Always prefer successful scope-specific source collections over
          # more recently completed DOI-only or unrelated broad harvests.
          # Without this priority, scholar positions vary merely because
          # different sized source datasets finish in a different order.
          RUNS="$(gh run list --repo "$GITHUB_REPO" --status completed --limit 80 --json databaseId,name,createdAt,conclusion --jq '[.[] | select(.conclusion == "success") | select(.name == "Literature census (candidate harvest)" or .name == "Electrochemical expansion harvest" or .name == "DOI sentinel reconciliation" or .name == "Electrical therapies expansion harvest" or .name == "Electro-mediated pharmaceutics harvest")] | sort_by([(if .name == "Electro-mediated pharmaceutics harvest" then 4 elif .name == "Electrical therapies expansion harvest" then 3 elif .name == "DOI sentinel reconciliation" then 2 else 1 end), .createdAt]) | reverse | .[].databaseId')"
          CHOSEN=""
          for TRY_ID in $RUNS; do
            rm -rf _harvest
            mkdir -p _harvest
            if ! gh run download "$TRY_ID" --repo "$GITHUB_REPO" --name "literature-candidates-and-audit" --dir _harvest >/dev/null 2>&1; then
              continue
            fi
            if python - <<'PY'
          import json,pathlib
          file=pathlib.Path("_harvest/candidates.json")
          if not file.is_file():raise SystemExit(1)
          data=json.loads(file.read_text(encoding="utf8"))
          works=data.get("records") or []
          total=len(works)
          with_ids=sum(bool(w.get("openalex_id")) for w in works)
          print("Candidate harvest validation: all",total,"OpenAlex linked",with_ids)
          if total < 10000 or with_ids < 5000:raise SystemExit(1)
          PY
            then
              CHOSEN="$TRY_ID"
              break
            fi
          done
          if [ -z "$CHOSEN" ]; then
            echo "::error::No literature artifact passes coverage gates. Previous website left intact."
            exit 1
          fi
          echo "Using validated candidate harvest run: $CHOSEN"
          cp _harvest/summary.json _site/data/search_summary.json
          cp _harvest/query_audit.json _site/data/query_audit.json
          export CHOSEN_SOURCE="$CHOSEN"
          python - <<'PY'
          import json,os,pathlib
          s=json.loads(pathlib.Path("_harvest/summary.json").read_text())
          provenance={"source_run_id":os.environ.get("CHOSEN_SOURCE",""),
             "source_candidate_records":s.get("candidate_records"),
             "search_strings_executed":s.get("search_strings_executed"),
             "search_errors":s.get("errors"),
             "retrieval_conclusion":"provisional evidence only: not independently validated"}
          pathlib.Path("_site/data/source_provenance.json").write_text(json.dumps(provenance),encoding="utf-8")
          PY
      - name: Validate identity, merge and institution regression tests
        run: python -m unittest discover -s tests -v
      - name: Generate narrowly scoped electro-mediated pharmaceutical researcher index
        run: |
          python methods/electropharmaceutics_focus.py \
            --input _harvest/candidates.json \
            --output _site/data/electropharmaceutics_rankings.json \
            --csv _site/data/electropharmaceutics_rankings.csv \
            --register _site/data/electropharmaceutics_screening_register.json
          python - <<'PY'
          import json
          d=json.load(open("_site/data/electropharmaceutics_rankings.json"))
          assert d["scope"]=="Electro-Mediated Pharmaceutics"
          assert d["scientific_validation"]=="NOT_INDEPENDENTLY_SCREENED"
          assert set(d["rankings"])=={"Overall","Electro-Mediated Pharmaceutics"}
          assert d["summary"]["machine_screened_papers"]>0
          assert "TTFields" not in d["rankings"]
          print("Focus only; no worldwide or cross-treatment numerical claims")
          PY
      - name: Publish documented researcher paper omissions, exclusion and ORCID checks
        run: |
          python methods/audit_researcher_publications.py \
            --input _harvest/candidates.json \
            --reference evidence/rawson_publisher_reference_dois.json \
            --output _site/data/rawson_publication_audit.json
          python - <<'PY'
          import json
          report=json.load(open("_site/data/rawson_publication_audit.json"))
          assert report["status"]=="BIBLIOGRAPHY_SAMPLE_NOT_EXHAUSTIVE"
          assert report["full_text_screened_independently"]==0
          assert report["total_reference_works"]>=6
          print("Publisher-identified DOI sample:",report["found_in_candidate_corpus"],"of",report["total_reference_works"])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
